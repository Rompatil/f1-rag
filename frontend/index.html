<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 RAG — Formula 1 Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #16161f;
  --bg-card-hover: #1c1c28;
  --border: #2a2a3a;
  --border-accent: #e10600;
  --text-primary: #f0f0f5;
  --text-secondary: #8888a0;
  --text-muted: #55556a;
  --accent-red: #e10600;
  --accent-red-dim: rgba(225, 6, 0, 0.15);
  --accent-green: #00d26a;
  --accent-yellow: #ffd700;
  --accent-blue: #00a8ff;
  --confidence-high: #00d26a;
  --confidence-medium: #ffd700;
  --confidence-low: #e10600;
  --font-display: 'Outfit', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-display);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Background texture ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 20% 0%, rgba(225, 6, 0, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(0, 168, 255, 0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Layout ── */
.app {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px 120px;
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: 48px;
  animation: fadeDown 0.6s ease;
}

.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--accent-red-dim);
  border: 1px solid rgba(225, 6, 0, 0.3);
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-red);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 20px;
}

.header-badge .dot {
  width: 6px; height: 6px;
  background: var(--accent-red);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

h1 {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 12px;
}

h1 .accent { color: var(--accent-red); }

.subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  font-weight: 300;
}

/* ── Search ── */
.search-container {
  position: relative;
  margin-bottom: 32px;
  animation: fadeUp 0.6s ease 0.1s both;
}

.search-box {
  display: flex;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box:focus-within {
  border-color: var(--accent-red);
  box-shadow: 0 0 0 3px var(--accent-red-dim);
}

.search-box input {
  flex: 1;
  padding: 18px 20px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
}

.search-box input::placeholder {
  color: var(--text-muted);
}

.search-btn {
  padding: 18px 28px;
  background: var(--accent-red);
  border: none;
  color: white;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.search-btn:hover { background: #c80500; }
.search-btn:disabled { background: #5a5a6a; cursor: not-allowed; }

/* ── Example queries ── */
.examples {
  margin-bottom: 40px;
  animation: fadeUp 0.6s ease 0.2s both;
}

.examples-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 14px;
  font-weight: 600;
}

.example-categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.cat-btn {
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 100px;
  color: var(--text-secondary);
  font-family: var(--font-display);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}

.cat-btn:hover, .cat-btn.active {
  border-color: var(--accent-red);
  color: var(--text-primary);
  background: var(--accent-red-dim);
}

.example-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.example-query {
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: var(--font-display);
}

.example-query:hover {
  background: var(--bg-card);
  border-color: var(--border);
  color: var(--text-primary);
  transform: translateX(4px);
}

/* ── Loading ── */
.loading {
  display: none;
  text-align: center;
  padding: 60px 0;
}

.loading.active { display: block; }

.loading-track {
  width: 200px;
  height: 3px;
  background: var(--bg-card);
  border-radius: 2px;
  margin: 0 auto 20px;
  overflow: hidden;
}

.loading-car {
  width: 40px;
  height: 100%;
  background: var(--accent-red);
  border-radius: 2px;
  animation: race 1.2s ease-in-out infinite;
}

.loading-text {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 400;
}

/* ── Result ── */
.result {
  display: none;
  animation: fadeUp 0.4s ease;
}

.result.active { display: block; }

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.result-meta {
  display: flex;
  gap: 16px;
  align-items: center;
}

.meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-mono);
}

.meta-pill.confidence {
  border: 1px solid;
}

.meta-pill.confidence.high {
  color: var(--confidence-high);
  border-color: rgba(0, 210, 106, 0.3);
  background: rgba(0, 210, 106, 0.08);
}

.meta-pill.confidence.medium {
  color: var(--confidence-medium);
  border-color: rgba(255, 215, 0, 0.3);
  background: rgba(255, 215, 0, 0.08);
}

.meta-pill.confidence.low {
  color: var(--confidence-low);
  border-color: rgba(225, 6, 0, 0.3);
  background: var(--accent-red-dim);
}

.meta-pill.latency {
  color: var(--text-muted);
  background: var(--bg-secondary);
}

.meta-pill.cached {
  color: var(--accent-blue);
  background: rgba(0, 168, 255, 0.1);
}

.query-echo {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}

/* ── Answer card ── */
.answer-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.answer-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--accent-red);
}

.answer-content {
  font-size: 15px;
  line-height: 1.75;
  color: var(--text-primary);
  white-space: pre-wrap;
}

.answer-content strong, .answer-content b {
  color: var(--accent-red);
  font-weight: 600;
}

/* ── Sources panel ── */
.sources-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-display);
  font-size: 14px;
  cursor: pointer;
  transition: color 0.2s;
  width: 100%;
  text-align: left;
}

.sources-toggle:hover { color: var(--text-primary); }
.sources-toggle .arrow { transition: transform 0.2s; }
.sources-toggle.open .arrow { transform: rotate(90deg); }

.sources-panel {
  display: none;
  margin-top: 8px;
}

.sources-panel.open {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.source-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  transition: border-color 0.2s;
}

.source-card:hover {
  border-color: var(--accent-red);
}

.source-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.source-id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent-red);
  font-weight: 500;
}

.source-category {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 2px 8px;
  background: var(--bg-card);
  border-radius: 4px;
}

.source-score {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

.source-content {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  max-height: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── System status bar ── */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 24px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  z-index: 100;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-green);
}

.status-dot.offline { background: var(--accent-red); }

/* ── Animations ── */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

@keyframes race {
  0% { transform: translateX(-40px); }
  50% { transform: translateX(200px); }
  100% { transform: translateX(-40px); }
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .app { padding: 24px 16px 100px; }
  h1 { font-size: 28px; }
  .search-btn { padding: 16px 18px; font-size: 13px; }
  .result-meta { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-badge"><span class="dot"></span> RAG-Powered</div>
    <h1>F1 <span class="accent">Intelligence</span></h1>
    <p class="subtitle">Ask anything about Formula 1 — powered by retrieval-augmented generation</p>
  </div>

  <!-- Search -->
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Ask an F1 question..."
             autocomplete="off" spellcheck="false">
      <button class="search-btn" id="queryBtn" onclick="submitQuery()">QUERY</button>
    </div>
  </div>

  <!-- Example Queries -->
  <div class="examples" id="examplesSection">
    <div class="examples-label">Try a question</div>
    <div class="example-categories" id="catBtns"></div>
    <div class="example-list" id="exampleList"></div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="loading-track"><div class="loading-car"></div></div>
    <div class="loading-text">Retrieving context & generating answer...</div>
  </div>

  <!-- Result -->
  <div class="result" id="result">
    <div class="result-header">
      <div class="query-echo" id="queryEcho"></div>
      <div class="result-meta" id="resultMeta"></div>
    </div>

    <div class="answer-card">
      <div class="answer-content" id="answerContent"></div>
    </div>

    <button class="sources-toggle" id="sourcesToggle" onclick="toggleSources()">
      <span class="arrow">▶</span>
      <span id="sourcesLabel">Show retrieved sources (0)</span>
    </button>
    <div class="sources-panel" id="sourcesPanel"></div>
  </div>
</div>

<!-- Status Bar -->
<div class="status-bar">
  <div class="status-item">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
  <div class="status-item" id="indexInfo"></div>
  <div class="status-item" id="cacheInfo"></div>
</div>

<script>
const API = window.location.origin;

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  loadExamples();
  document.getElementById('queryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitQuery();
  });
  setInterval(checkHealth, 30000);
});

// ── Health check ──
async function checkHealth() {
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    const index = document.getElementById('indexInfo');
    const cache = document.getElementById('cacheInfo');

    if (data.status === 'ready') {
      dot.classList.remove('offline');
      text.textContent = 'System Ready';
      index.textContent = `${data.chunks_indexed} chunks indexed`;
      const cs = data.cache_stats;
      cache.textContent = `Cache: ${cs.hits}/${cs.hits + cs.misses} hits`;
    } else {
      dot.classList.add('offline');
      text.textContent = 'Not Ready';
    }
  } catch {
    document.getElementById('statusDot').classList.add('offline');
    document.getElementById('statusText').textContent = 'Offline';
  }
}

// ── Load example queries ──
async function loadExamples() {
  try {
    const res = await fetch(`${API}/examples`);
    const data = await res.json();
    const catContainer = document.getElementById('catBtns');
    const listContainer = document.getElementById('exampleList');

    data.categories.forEach((cat, i) => {
      const btn = document.createElement('button');
      btn.className = `cat-btn${i === 0 ? ' active' : ''}`;
      btn.textContent = `${cat.icon} ${cat.name}`;
      btn.onclick = () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderExamples(cat.queries);
      };
      catContainer.appendChild(btn);
    });

    renderExamples(data.categories[0].queries);

    function renderExamples(queries) {
      listContainer.innerHTML = '';
      queries.forEach(q => {
        const el = document.createElement('button');
        el.className = 'example-query';
        el.textContent = q;
        el.onclick = () => {
          document.getElementById('queryInput').value = q;
          submitQuery();
        };
        listContainer.appendChild(el);
      });
    }
  } catch {
    // Examples endpoint not available, hide section
  }
}

// ── Submit query (streaming) ──
async function submitQuery() {
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  if (!query) return;

  // UI state
  document.getElementById('examplesSection').style.display = 'none';
  document.getElementById('result').classList.remove('active');
  document.getElementById('loading').classList.add('active');
  document.getElementById('queryBtn').disabled = true;

  // Reset result area
  document.getElementById('queryEcho').textContent = `"${query}"`;
  document.getElementById('resultMeta').innerHTML = '<span class="meta-pill latency">Streaming...</span>';
  document.getElementById('answerContent').innerHTML = '';
  document.getElementById('sourcesPanel').innerHTML = '';
  document.getElementById('sourcesToggle').classList.remove('open');
  document.getElementById('sourcesPanel').classList.remove('open');

  try {
    const res = await fetch(`${API}/query/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // Show result container immediately
    document.getElementById('loading').classList.remove('active');
    document.getElementById('result').classList.add('active');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullAnswer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // Keep incomplete line in buffer

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          var currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ') && currentEvent) {
          const data = JSON.parse(line.slice(6));

          if (currentEvent === 'sources') {
            renderSources(data);
          } else if (currentEvent === 'token') {
            fullAnswer += data;
            document.getElementById('answerContent').innerHTML = formatAnswer(fullAnswer);
          } else if (currentEvent === 'done') {
            renderMeta(data, query);
          }
          currentEvent = null;
        }
      }
    }
  } catch (err) {
    document.getElementById('loading').classList.remove('active');
    renderError(err.message);
  } finally {
    document.getElementById('queryBtn').disabled = false;
    checkHealth();
  }
}

// ── Render sources from stream ──
function renderSources(sources) {
  document.getElementById('sourcesLabel').textContent = `Show retrieved sources (${sources.length})`;
  const panel = document.getElementById('sourcesPanel');
  panel.innerHTML = '';

  sources.forEach(s => {
    const card = document.createElement('div');
    card.className = 'source-card';
    card.innerHTML = `
      <div class="source-header">
        <span class="source-id">${s.chunk_id}</span>
        <span class="source-category">${s.category.replace('_', ' ')}</span>
        <span class="source-score">Score: ${s.score.toFixed(3)}</span>
      </div>
      <div class="source-content">${escapeHtml(s.content)}</div>
    `;
    panel.appendChild(card);
  });
}

// ── Render final metadata ──
function renderMeta(data, query) {
  const meta = document.getElementById('resultMeta');
  const conf = data.confidence || 0.5;
  const confLevel = conf >= 0.8 ? 'high' : conf >= 0.6 ? 'medium' : 'low';
  const confLabel = conf >= 0.8 ? 'High' : conf >= 0.6 ? 'Medium' : 'Low';

  meta.innerHTML = `
    <span class="meta-pill confidence ${confLevel}">● ${confLabel} (${Math.round(conf * 100)}%)</span>
    <span class="meta-pill latency">${data.latency_ms || 0}ms</span>
    ${data.cached ? '<span class="meta-pill cached">⚡ Cached</span>' : ''}
  `;

  // Clean confidence line from displayed answer
  const content = document.getElementById('answerContent');
  let text = content.textContent || '';
  text = text.replace(/\n*CONFIDENCE:\s*\[?(high|medium|low)\]?\s*$/i, '').trim();
  content.innerHTML = formatAnswer(text);
}

function formatAnswer(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^[-•]\s+(.+)$/gm, '<span style="color:var(--accent-red);margin-right:6px;">▸</span>$1');
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderError(msg) {
  document.getElementById('queryEcho').textContent = '';
  document.getElementById('resultMeta').innerHTML = '';
  document.getElementById('answerContent').innerHTML =
    `<span style="color:var(--accent-red)">Error: ${escapeHtml(msg)}</span><br><br>Make sure the API server is running: <code style="color:var(--accent-blue)">python run.py --serve</code>`;
  document.getElementById('sourcesPanel').innerHTML = '';
  document.getElementById('result').classList.add('active');
}

// ── Toggle sources ──
function toggleSources() {
  const btn = document.getElementById('sourcesToggle');
  const panel = document.getElementById('sourcesPanel');
  btn.classList.toggle('open');
  panel.classList.toggle('open');
}
</script>
</body>
</html>
